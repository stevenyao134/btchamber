<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Battery safety test chamber illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12263F"/><stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B33"/><stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="18" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-opacity=".045">
    <path d="M0 60h400M0 120h400M0 180h400M0 240h400M60 0v300M120 0v300M180 0v300M240 0v300M300 0v300M360 0v300"/>
  </g>
  <!-- chamber body -->
  <rect x="76" y="34" width="248" height="204" rx="14" fill="#132844" stroke="#1E6EF7" stroke-opacity=".55" stroke-width="1.5"/>
  <!-- door -->
  <rect x="96" y="54" width="140" height="164" rx="10" fill="#0E1E36" stroke="#2A4A7A" stroke-width="1.5"/>
  <!-- window -->
  <rect x="112" y="70" width="108" height="118" rx="8" fill="url(#win)" stroke="#2A4A7A"/>
  <!-- cell inside window -->
  <rect x="142" y="112" width="48" height="62" rx="6" fill="#1A3357" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="152" y="112" width="28" height="12" rx="3" fill="#E3EEFF"/>
  <path d="M152 112h18M152 174h18" stroke="#E3EEFF" stroke-width="2.5"/>
  <text x="166" y="152" font-family="Arial" font-size="8" fill="#F59E0B" text-anchor="middle">TEST</text>
  <!-- hazard stripes on door edge -->
  <g>
    <path d="M236 54l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 14zm0 14l10 0 -10 12" fill="#F59E0B"/>
  </g>
  <!-- control panel -->
  <g font-family="Arial, sans-serif" font-size="8" fill="#7D93B4">
    <rect x="262" y="66" width="46" height="34" rx="6" fill="#0E2440" stroke="#2A4A7A"/><text x="285" y="80" text-anchor="middle" fill="#4FC3F7">200°C</text><text x="285" y="92" text-anchor="middle" font-size="7">CHAMBER</text>
    <rect x="262" y="112" width="46" height="34" rx="6" fill="#0E2440" stroke="#2A4A7A"/><text x="285" y="126" text-anchor="middle" fill="#4FC3F7">10kA</text><text x="285" y="138" text-anchor="middle" font-size="7">SHORT CKT</text>
    <rect x="262" y="158" width="46" height="34" rx="6" fill="#0E2440" stroke="#2A4A7A"/><text x="285" y="172" text-anchor="middle" fill="#4FC3F7">20T</text><text x="285" y="184" text-anchor="middle" font-size="7">CRUSH</text>
    <rect x="262" y="204" width="46" height="22" rx="6" fill="#0E2440" stroke="#2A4A7A"/><text x="285" y="218" text-anchor="middle" fill="#DC2626">RUN</text>
  </g>
  <!-- vent -->
  <g stroke="#2A4A7A" stroke-width="2">
    <path d="M96 218h140M110 228h140M124 238h140"/>
  </g>
  <text x="76" y="264" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E3EEFF" letter-spacing="2">VT-SAFE  SAFETY TEST CHAMBER</text>
</svg>
