<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#132844"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E6EF7"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Lightning bolt icon -->
  <g transform="translate(120, 180)">
    <path d="M80 0L20 120h48l-16 80 80-128H72z" fill="url(#accent)" opacity="0.9"/>
  </g>
  <!-- Brand name -->
  <text x="300" y="260" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF">Volt<tspan fill="#4FC3F7">Test</tspan></text>
  <!-- Tagline -->
  <text x="300" y="320" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="500" fill="#9BB0CC">Battery Testing Equipment Manufacturer</text>
  <!-- Feature points -->
  <text x="300" y="400" font-family="Inter, Arial, sans-serif" font-size="22" fill="#7A8FA8">Battery Cyclers · Safety Test Chambers · Formation &amp; Grading</text>
  <text x="300" y="440" font-family="Inter, Arial, sans-serif" font-size="22" fill="#7A8FA8">Module/Pack Test Systems · Electrical Safety Testers</text>
  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.8"/>
  <!-- Domain -->
  <text x="300" y="520" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#4FC3F7">www.btchamber.com</text>
</svg>