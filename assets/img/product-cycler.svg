<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Battery charge discharge test system illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12263F"/><stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B33"/><stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1E6EF7"/><stop offset="1" stop-color="#4FC3F7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="18" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-opacity=".045">
    <path d="M0 60h400M0 120h400M0 180h400M0 240h400M60 0v300M120 0v300M180 0v300M240 0v300M300 0v300M360 0v300"/>
  </g>
  <!-- device body -->
  <rect x="60" y="34" width="280" height="232" rx="14" fill="#132844" stroke="#1E6EF7" stroke-opacity=".55" stroke-width="1.5"/>
  <rect x="76" y="50" width="248" height="104" rx="8" fill="url(#scr)" stroke="#2A4A7A"/>
  <!-- waveform -->
  <polyline points="86,138 118,96 150,120 182,70 214,96 246,58 278,84 310,66" fill="none" stroke="#4FC3F7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="86,138 118,132 150,134 182,130 214,132 246,130 278,133 310,131" fill="none" stroke="#1E6EF7" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="88" y="54" font-family="Arial, sans-serif" font-size="9" fill="#5B7DA6">CH-01  CC-CV  Discharge</text>
  <!-- channel LEDs -->
  <g font-family="Arial, sans-serif" font-size="8" fill="#7D93B4">
    <circle cx="88" cy="178" r="4" fill="#16A34A"/><text x="98" y="181">CH-01</text><rect x="150" y="172" width="42" height="10" rx="4" fill="#0E2440"/><rect x="150" y="172" width="30" height="10" rx="4" fill="url(#bar)"/>
    <circle cx="88" cy="202" r="4" fill="#4FC3F7"/><text x="98" y="205">CH-02</text><rect x="150" y="196" width="42" height="10" rx="4" fill="#0E2440"/><rect x="150" y="196" width="24" height="10" rx="4" fill="url(#bar)"/>
    <circle cx="88" cy="226" r="4" fill="#4FC3F7"/><text x="98" y="229">CH-03</text><rect x="150" y="220" width="42" height="10" rx="4" fill="#0E2440"/><rect x="150" y="220" width="36" height="10" rx="4" fill="url(#bar)"/>
    <circle cx="88" cy="250" r="4" fill="#16A34A"/><text x="98" y="253">CH-04</text><rect x="150" y="244" width="42" height="10" rx="4" fill="#0E2440"/><rect x="150" y="244" width="18" height="10" rx="4" fill="url(#bar)"/>
  </g>
  <g>
    <circle cx="286" cy="178" r="7" fill="#1E6EF7"/><text x="286" y="181" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">ON</text>
    <circle cx="314" cy="178" r="7" fill="none" stroke="#2A4A7A" stroke-width="1.5"/><text x="314" y="181" font-family="Arial" font-size="7" fill="#5B7DA6" text-anchor="middle">STOP</text>
    <circle cx="286" cy="240" r="10" fill="none" stroke="#1E6EF7" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="286" cy="240" r="5" fill="#1E6EF7"/>
    <circle cx="314" cy="240" r="10" fill="none" stroke="#2A4A7A" stroke-width="2"/>
  </g>
  <text x="76" y="278" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E3EEFF" letter-spacing="2">VT-CDS  CHARGE / DISCHARGE SYSTEM</text>
</svg>
